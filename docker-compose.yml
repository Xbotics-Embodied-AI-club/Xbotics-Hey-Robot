name: hey-robot

x-common-env: &common-env
  PYTHONUNBUFFERED: "1"

x-common-volumes: &common-volumes
  - ./configs:/app/configs:ro
  - ./runtime:/app/runtime

services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "${HEY_ROBOT_NATS_PORT:-4222}:4222"
      - "${HEY_ROBOT_NATS_MONITOR_PORT:-8222}:8222"
    command: ["-js", "-m", "8222"]
    restart: unless-stopped

  vla:
    build:
      context: .
      dockerfile: docker/Dockerfile.vla
      args:
        CUDA_VERSION: ${HEY_ROBOT_CUDA_VERSION:-12.6.2}
        PYTHON_VERSION: ${HEY_ROBOT_PYTHON_VERSION:-3.12}
    image: ${HEY_ROBOT_VLA_IMAGE:-hey-robot-vla:latest}
    environment: *common-env
    volumes:
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
    depends_on:
      - nats
    ports:
      - "${HEY_ROBOT_VLA_PORT:-9090}:9090"
    command:
      - --config
      - ${HEY_ROBOT_VLA_CONFIG:-/app/configs/xlerobot.sim.vla_vln.yaml}
      - --service-id
      - ${HEY_ROBOT_VLA_SERVICE_ID:-manipulate}
      - --host
      - "0.0.0.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HEY_ROBOT_VLA_GPU:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - gpu

  vln:
    build:
      context: .
      dockerfile: docker/Dockerfile.vln
      args:
        CUDA_VERSION: ${HEY_ROBOT_CUDA_VERSION:-12.6.2}
        PYTHON_VERSION: ${HEY_ROBOT_PYTHON_VERSION:-3.12}
    image: ${HEY_ROBOT_VLN_IMAGE:-hey-robot-vln:latest}
    environment: *common-env
    volumes:
      - ./configs:/app/configs:ro
      - ./runtime:/app/runtime
      - ./models:/app/models:ro
    depends_on:
      - nats
    ports:
      - "${HEY_ROBOT_VLN_PORT:-9091}:9091"
    command:
      - --config
      - ${HEY_ROBOT_VLN_CONFIG:-/app/configs/xlerobot.sim.ubuntu.yaml}
      - --service-id
      - ${HEY_ROBOT_VLN_SERVICE_ID:-vln_nav}
      - --host
      - "0.0.0.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HEY_ROBOT_VLN_GPU:-1}"]
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - gpu

  robocasa365:
    build:
      context: .
      dockerfile: docker/Dockerfile.robocasa365
      args:
        # Resolve this to an immutable digest before a reproducible benchmark.
        LEROBOT_BASE_IMAGE: ${HEY_ROBOT_ROBOCASA_BASE_IMAGE:-python:3.12-bookworm}
        IMAGE_REVISION: ${HEY_ROBOT_ROBOCASA_IMAGE_REVISION:-unknown}
    image: ${HEY_ROBOT_ROBOCASA_IMAGE:-hey-robot-robocasa365:latest}
    environment:
      MUJOCO_GL: egl
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      ROBOCASA_EVALUATOR_TOKEN: ${ROBOCASA_EVALUATOR_TOKEN:?set an evaluator control-plane token}
      ROBOCASA_DATA_TOKEN: ${ROBOCASA_DATA_TOKEN:?set a Robot Runtime data-plane token}
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      ROBOCASA_ASSET_ROOT: /root/.robocasa
      ROBOCASA_MODEL_ASSET_ROOT: /opt/bridge/.venv/lib/python3.12/site-packages/robocasa/models/assets
      ROBOCASA_ASSET_READY_FILE: /opt/bridge/.venv/lib/python3.12/site-packages/robocasa/models/assets/.robocasa-assets-ready
    volumes:
      - ${HF_CACHE_DIR:-/home/liber/.cache/huggingface}:/cache/huggingface
      # RoboCasa creates derived MJCF XML next to object assets during environment reset.
      - ./artifacts/robocasa365/merged-assets:/opt/bridge/.venv/lib/python3.12/site-packages/robocasa/models/assets
      - ./runtime/robocasa365:/outputs
    ports:
      - "${HEY_ROBOT_ROBOCASA_PORT:-9092}:9092"
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - robocasa

  runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${HEY_ROBOT_PYTHON_VERSION:-3.12}
    platform: ${HEY_ROBOT_RUNTIME_PLATFORM:-linux/amd64}
    environment: *common-env
    volumes: *common-volumes
    depends_on:
      - nats
    ports:
      - "${HEY_ROBOT_GATEWAY_PORT:-8080}:8080"
      - "${HEY_ROBOT_MONITOR_PORT:-8081}:8081"
    command:
      - hey-robot
      - run
      - --config
      - /app/configs/deployment/mock.dev.yaml
    restart: unless-stopped
