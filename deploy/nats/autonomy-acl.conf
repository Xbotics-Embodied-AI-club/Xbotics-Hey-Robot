# NATS permissions for the autonomous runtime. Passwords are supplied by the
# deployment environment; never commit their values alongside this file.
authorization {
  users = [
    {
      user: "autonomy_supervisor"
      password: $HEY_ROBOT_NATS_SUPERVISOR_PASSWORD
      permissions: { publish: { allow: [">"] }, subscribe: { allow: [">"] } }
    },
    {
      user: "agent"
      password: $HEY_ROBOT_NATS_AGENT_PASSWORD
      permissions: { publish: { allow: [">"], deny: ["skill.intent"] }, subscribe: { allow: [">"] } }
    },
    {
      user: "skill_controller"
      password: $HEY_ROBOT_NATS_SKILL_CONTROLLER_PASSWORD
      permissions: { publish: { allow: [">"], deny: ["skill.intent"] }, subscribe: { allow: [">"] } }
    },
    {
      user: "robot"
      password: $HEY_ROBOT_NATS_ROBOT_PASSWORD
      permissions: { publish: { allow: [">"], deny: ["skill.intent"] }, subscribe: { allow: [">"] } }
    },
    {
      user: "gateway"
      password: $HEY_ROBOT_NATS_GATEWAY_PASSWORD
      permissions: { publish: { allow: [">"], deny: ["skill.intent"] }, subscribe: { allow: [">"] } }
    },
    {
      user: "human_follow"
      password: $HEY_ROBOT_NATS_HUMAN_FOLLOW_PASSWORD
      permissions: { publish: { allow: [">"], deny: ["skill.intent"] }, subscribe: { allow: [">"] } }
    }
  ]
}
