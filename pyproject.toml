[project]
name = "hey-robot"
version = "1.0.0"
description = "Embodied-native Agent Harness with an asynchronous fast/slow architecture"
authors = [{ name = "Hey Robot Contributors" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Core dependencies — shared by the main runtime.
# Usage:
#   uv sync                  → main runtime (Agent / Skill OS / Robot)
#   uv sync --group sim      → main runtime + MuJoCo simulation
#   uv sync --group vla      → VLA model service  (lerobot ACT policy)
#   uv sync --group vln      → VLN model service  (InternVLA-N1 planner)
#   uv sync --only-group robocasa365 → isolated RoboCasa365 backend
#   uv sync --group dev      → lint / type-check / test tooling
#
# Note: --group vla and --group vln are mutually exclusive (conflicting
# huggingface-hub / transformers versions).  Use separate venvs for each.
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "httpx[socks]>=0.28.1",
    "pyzmq>=25.0.0",
    "nats-py>=2.8.0",
    "grpcio==1.73.1",
    "protobuf>=6.31.0,<7",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "pyserial>=3.5",
    "opencv-python==4.10.0.84",
    "json-repair>=0.54.0",
    "jinja2>=3.1.0",
    "openai>=1.90.0",
    "fastapi>=0.115.0",
    "starlette>=0.45,<1.0.0",
    "uvicorn>=0.30.0",
    "sounddevice>=0.4.6",
    "sherpa-onnx>=1.12.0",
    "sherpa-onnx-core>=1.12.0",
    "lark-oapi>=1.5.0,<2.0.0",
    "websockets>=12.0",
    "torch>=2.0.0",
    "feetech-servo-sdk==1.0.0",
    "ultralytics>=8.4.67",
    "wsproto>=1.3.2",
    "sniffio>=1.3.1",
    "distro>=1.9.0",
]

[project.scripts]
hey-robot = "hey_robot.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux' and python_version == '3.12'",
    "sys_platform == 'win32' and python_version == '3.12'",
]
conflicts = [
    [
        { group = "vla" },
        { group = "vln" },
    ],
    [
        { group = "robocasa365" },
        { group = "vla" },
    ],
    [
        { group = "robocasa365" },
        { group = "vln" },
    ],
]
override-dependencies = [
    # lerobot 强制依赖 opencv-python-headless（无 cv2.imshow），
    # 但项目需要完整的 opencv-python（human_follow 等 UI 场景），
    # opencv-python 是 headless 的超集，可以安全替换。
    "opencv-python==4.10.0.84",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

# RoboCasa 1.0.0 incorrectly pins lerobot==0.3.3, which is incompatible with
# the PI0.5 implementation used by RoboCasa365. robosuite also declares the UI
# OpenCV wheel although this backend is headless. The real, pinned runtime
# dependencies are declared explicitly in the robocasa365 group below.
[[tool.uv.dependency-metadata]]
name = "lerobot"
version = "0.6.1"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "robocasa"
version = "1.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "robosuite"
version = "1.5.2"
requires-dist = []

[tool.poe.executor]
type = "simple"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "^src/hey_robot/foundation/contract/v1/model_service_pb2.py$",
    "^src/hey_robot/foundation/contract/v1/model_service_pb2_grpc.py$",
]

[tool.coverage.run]
data_file = "artifacts/test/.coverage"

[dependency-groups]
sim = ["mujoco>=3.3.0"]

# Isolated Linux backend for RoboCasa365 + PI0.5. Keep source revisions and
# Python pins here so local environments and Docker consume the same uv.lock.
# CUDA drivers, EGL system libraries, model weights, and RoboCasa assets are
# runtime resources and intentionally do not belong in a Python dependency
# group.
robocasa365 = [
    "torch==2.7.1; sys_platform == 'linux'",
    "torchvision==0.22.1; sys_platform == 'linux'",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@cb73cf3ffa1cec60640a06b924c2174548ae2b1b",
    "robocasa @ git+https://github.com/robocasa/robocasa.git@56e355ccc64389dfc1b8a61a33b9127b975ba681",
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@aaa8b9b214ce8e77e82926d677b4d61d55e577ab",
    "numpy==2.2.5",
    "numba==0.61.2",
    "scipy==1.15.3",
    "mujoco==3.3.1",
    "pygame==2.6.1",
    "pillow==12.2.0",
    "opencv-python-headless==4.13.0.92",
    "pyyaml==6.0.3",
    "pynput==1.8.1",
    "tqdm==4.67.3",
    "termcolor==3.3.0",
    "imageio==2.37.3",
    "h5py==3.16.0",
    "lxml==6.0.4",
    "hidapi==0.14.0.post4",
    "gymnasium==1.2.3",
    "qpsolvers[quadprog]>=4.3.1",
    "einops>=0.8.0,<0.9.0",
    "draccus==0.10.0",
    "huggingface-hub>=1.0.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "packaging>=24.2,<26.0",
    "safetensors>=0.4.3,<1.0.0",
    "transformers>=5.4.0,<5.6.0",
    "sentencepiece>=0.2.0,<0.3.0",
    "datasets>=4.7.0,<5.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=21.0.0,<30.0.0",
    "jsonlines>=4.0.0,<5.0.0",
    "av>=15.0.0,<16.0.0",
    "cmake>=3.29.0.1,<4.2.0",
    "setuptools>=71.0.0,<81.0.0",
    "grpcio==1.73.1",
    "protobuf>=6.31.0,<7",
    "python-dotenv>=1.2.2,<2",
]

vla = [
    "lerobot>=0.6.0",
    "safetensors>=0.7.0",
]

vln = [
    "transformers==4.51.0",
    "huggingface-hub==0.33.4",
    "diffusers==0.32.2",
    "accelerate==1.7.0",
    "flash-attn==2.7.2.post1",
    "safetensors==0.5.3",
    "tokenizers==0.21.2",
    "einops==0.8.1",
    "triton==3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "open3d==0.19.0",
    "tensorboard==2.20.0",
    "pandas==2.3.1",
    "pyarrow==21.0.0",
    "sympy==1.13.1",
    "hf-xet==1.1.5",
    "ftfy==6.3.1",
    "depth-camera-filtering @ git+https://github.com/naokiyokoyama/depth_camera_filtering.git",
    "diffusion-policy @ git+https://github.com/real-stanford/diffusion_policy.git@5ba07ac6661db573af695b419a7947ecb704690f",
]

dev = [
    "mypy>=1.0.0",
    "poethepoet>=0.45.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "types-PyYAML",
    "ruff>=0.14.13",
    "pytest-asyncio>=1.3.0",
    "pytest-env>=1.6.0",
    "grpcio-tools>=1.62.0",
]

[tool.poe.tasks._validate-config]
help = "Validate config file references are not stale"
cmd = "uv run --no-sync python scripts/dev/validate_config.py"

[tool.poe.tasks.style]
help = "Format and auto-fix the repository"
sequence = [
    { cmd = "uv run --no-sync ruff format ." },
    { cmd = "uv run --no-sync ruff check . --fix" },
]

[tool.poe.tasks.lint]
help = "Run lint and type checks"
sequence = [
    { ref = "_validate-config" },
    { cmd = "uv run --no-sync ruff check ." },
    { cmd = "uv run --no-sync mypy src" },
]

[tool.poe.tasks.test]
help = "Run the test suite with coverage"
cmd = "uv run --no-sync python -m pytest -q"

[tool.poe.tasks.clean]
help = "Clean pyc, build, test, and lint artifacts"
sequence = [
    { cmd = "python scripts/dev/clean.py pyc" },
    { cmd = "python scripts/dev/clean.py build" },
    { cmd = "python scripts/dev/clean.py test" },
    { cmd = "python scripts/dev/clean.py lint" },
]

[tool.poe.tasks.proto]
help = "Regenerate model service protobuf and gRPC contract artifacts"
cmd = "powershell -ExecutionPolicy Bypass -File scripts/dev/generate_model_service_proto.ps1"
