[project]
name = "hey-robot"
version = "1.0.0"
description = "Embodied-native Agent Harness with an asynchronous fast/slow architecture"
authors = [{ name = "Hey Robot Contributors" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Runtime dependencies are split by deployable service.
# Usage:
#   uv sync --extra gateway  → HTTP/WebSocket gateway
#   uv sync --extra agent    → autonomous agent
#   uv sync --extra robot    → robot driver + native SkillWorker
#   uv sync --extra human-follow → optional local YOLO/Torch perception
#   uv sync --extra voice    → optional local voice channel
#   uv sync --extra model-service --group lerobot-policy → LeRobot policy service
#   uv sync --extra model-service --group vln → VLN model service
#   uv sync --only-group robocasa365 → isolated RoboCasa365 backend
#   uv sync --group dev      → lint / type-check / test tooling
#
# Note: --group lerobot-policy and --group vln are mutually exclusive (conflicting
# huggingface-hub / transformers versions).  Use separate venvs for each.
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "nats-py>=2.8.0",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.115.0",
    "starlette>=0.45,<1.0.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "jinja2>=3.1.0",
    "lark-oapi>=1.5.0,<2.0.0",
]
agent = [
    "httpx[socks]>=0.28.1",
    "openai>=1.90.0",
    "jinja2>=3.1.0",
]
robot = [
    "grpcio==1.73.1",
    "protobuf>=6.31.0,<7",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "pyserial>=3.5",
    "opencv-python==4.10.0.84",
    "feetech-servo-sdk==1.0.0",
]
voice = [
    "httpx[socks]>=0.28.1",
    "sounddevice>=0.4.6",
    "sherpa-onnx>=1.12.0",
    "sherpa-onnx-core>=1.12.0",
    "websockets>=12.0",
]
human-follow = [
    "httpx[socks]>=0.28.1",
    "torch>=2.0.0",
    "ultralytics>=8.4.67",
]
model-service = [
    "grpcio==1.73.1",
    "protobuf>=6.31.0,<7",
]

[project.scripts]
hey-robot = "hey_robot.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux' and python_version == '3.12'",
    "sys_platform == 'win32' and python_version == '3.12'",
]
conflicts = [
    [
        { group = "lerobot-policy" },
        { group = "vln" },
    ],
    [
        { group = "robocasa365" },
        { group = "lerobot-policy" },
    ],
    [
        { group = "robocasa365" },
        { group = "vln" },
    ],
]
override-dependencies = [
    # lerobot 强制依赖 opencv-python-headless（无 cv2.imshow），
    # 但项目需要完整的 opencv-python（human_follow 等 UI 场景），
    # opencv-python 是 headless 的超集，可以安全替换。
    "opencv-python==4.10.0.84",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

# RoboCasa 1.0.0 incorrectly pins lerobot==0.3.3, which is incompatible with
# the PI0.5 implementation used by RoboCasa365. robosuite also declares the UI
# OpenCV wheel although this backend is headless. The real, pinned runtime
# dependencies are declared explicitly in the robocasa365 group below.
[[tool.uv.dependency-metadata]]
name = "lerobot"
version = "0.6.1"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "robocasa"
version = "1.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "robosuite"
version = "1.5.2"
requires-dist = []

[dependency-groups]
sim = ["mujoco>=3.3.0"]

# Isolated Linux environment backend for RoboCasa365. Training and general
# policy tooling live in the separate lerobot-policy image; this group keeps
# the LeRobot environment adapter, PI052 policy runtime, and simulation runtime. Keep source revisions and
# Python pins here so local environments and Docker consume the same uv.lock.
# CUDA drivers, EGL system libraries, model weights, and RoboCasa assets are
# runtime resources and intentionally do not belong in this dependency group.
robocasa365 = [
    # LeRobot's environment adapter imports torch for observation conversion;
    # policy/model dependencies remain in the separate policy group.
    "torch==2.7.1; sys_platform == 'linux'",
    "torchvision==0.22.1; sys_platform == 'linux'",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@cb73cf3ffa1cec60640a06b924c2174548ae2b1b",
    "robocasa @ git+https://github.com/robocasa/robocasa.git@56e355ccc64389dfc1b8a61a33b9127b975ba681",
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@aaa8b9b214ce8e77e82926d677b4d61d55e577ab",
    "numpy==2.2.5",
    "numba==0.61.2",
    "scipy==1.15.3",
    "mujoco==3.3.1",
    "pygame==2.6.1",
    "pillow==12.2.0",
    "opencv-python-headless==4.13.0.92",
    "pyyaml==6.0.3",
    "pynput==1.8.1",
    "tqdm==4.67.3",
    "termcolor==3.3.0",
    "imageio==2.37.3",
    "h5py==3.16.0",
    "lxml==6.0.4",
    "hidapi==0.14.0.post4",
    "gymnasium==1.2.3",
    "qpsolvers[quadprog]>=4.3.1",
    "einops>=0.8.0,<0.9.0",
    "draccus==0.10.0",
    "huggingface-hub>=1.0.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "packaging>=24.2,<26.0",
    "safetensors>=0.4.3,<1.0.0",
    "grpcio==1.73.1",
    "protobuf>=6.31.0,<7",
    "python-dotenv>=1.2.2,<2",
    # PI052 imports LeRobot's dataset processors at policy-load time. These
    # are the versions declared by the pinned lerobot[dataset] extra.
    "datasets>=4.7.0,<5.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=21.0.0,<30.0.0",
    "av>=15.0.0,<16.0.0",
    "torchcodec>=0.3.0,<0.12.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "jsonlines>=4.0.0,<5.0.0",
    # PI052's model loader uses the pinned LeRobot [pi] extra.
    "transformers>=5.4.0,<5.6.0",
    "sentencepiece>=0.2.0,<0.3.0",
]

lerobot-policy = [
    # Shared inference image for the policy families currently deployed here:
    # ACT is core; SmolVLA, PI0/PI0.5, and FastWAM need the explicit packages
    # below. Keep simulation/environment dependencies in separate groups.
    "lerobot>=0.6.0,<0.7.0",
    "torch==2.7.1; sys_platform == 'linux'",
    "torchvision==0.22.1; sys_platform == 'linux'",
    "transformers>=5.4.0,<5.6.0",
    "scipy>=1.14.0,<2.0.0",
    "accelerate>=1.7.0,<2.0.0",
    "diffusers>=0.38.0,<0.40.0",
    "num2words>=0.5.14,<0.6.0",
    "safetensors>=0.7.0",
]

vln = [
    # InternVLA-N1 was released and validated on the PyTorch 2.6 CUDA 12.6
    # stack. Declare the image runtime explicitly instead of relying on a
    # transitive dependency from InternNav's research packages.
    "torch==2.6.0",
    "torchvision==0.21.0",
    "opencv-python==4.10.0.84",
    "transformers==4.51.0",
    "huggingface-hub==0.33.4",
    "diffusers==0.32.2",
    "accelerate==1.7.0",
    "safetensors==0.5.3",
    "tokenizers==0.21.2",
    "einops==0.8.1",
    "triton==3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # The explicit PyTorch CUDA index ships thin wheels. Keep their runtime
    # libraries in this isolated group so .venv-vln works outside CUDA images.
    "nvidia-cublas-cu12==12.6.4.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-cupti-cu12==12.6.80; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-nvrtc-cu12==12.6.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12==12.6.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.5.1.17; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cufft-cu12==11.3.0.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cufile-cu12==1.11.1.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-curand-cu12==10.3.7.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusolver-cu12==11.7.1.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12==12.5.4.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparselt-cu12==0.6.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.26.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvjitlink-cu12==12.6.85; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvtx-cu12==12.6.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "open3d==0.19.0",
    "tensorboard==2.20.0",
    "pandas==2.3.1",
    "pyarrow==21.0.0",
    "sympy==1.13.1",
    "hf-xet==1.1.5",
    "ftfy==6.3.1",
    "depth-camera-filtering @ git+https://github.com/naokiyokoyama/depth_camera_filtering.git",
    "diffusion-policy @ git+https://github.com/real-stanford/diffusion_policy.git@5ba07ac6661db573af695b419a7947ecb704690f",
]

dev = [
    "mypy>=1.0.0",
    "poethepoet>=0.45.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "types-PyYAML",
    "ruff>=0.14.13",
    "pytest-asyncio>=1.3.0",
    "pytest-env>=1.6.0",
    "grpcio-tools>=1.62.0",
]
