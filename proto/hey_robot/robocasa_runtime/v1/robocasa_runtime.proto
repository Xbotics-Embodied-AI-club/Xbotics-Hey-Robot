syntax = "proto3";

package hey_robot.robocasa_runtime.v1;

import "google/protobuf/struct.proto";

service RoboCasaRuntime {
  rpc GetHealth(HealthRequest) returns (HealthResponse);
  rpc BeginTrial(BeginTrialRequest) returns (ObservationResponse);
  rpc Observe(EmptyRequest) returns (ObservationResponse);
  rpc Step(StepRequest) returns (StepResponse);
  rpc StepNative(NativeStepRequest) returns (NativeStepResponse);
  rpc LocalizePixels(LocalizePixelsRequest) returns (LocalizePixelsResponse);
  rpc ReadTruth(EmptyRequest) returns (TruthResponse);
  rpc EndTrial(EndTrialRequest) returns (EndTrialResponse);
}

message HealthRequest {}
message EmptyRequest {}

message HealthResponse {
  bool online = 1;
  bool loaded = 2;
  bool busy = 3;
  string error_message = 4;
  google.protobuf.Struct metrics = 5;
}

message BeginTrialRequest {
  string trial_id = 1;
  string task = 2;
  int64 seed = 3;
  string split = 4;
  repeated string registries = 5;
  string execution_artifact_dir = 6;
}

message ImageFrame {
  string camera = 1;
  bytes data = 2;
  string content_type = 3;
  uint32 width = 4;
  uint32 height = 5;
}

message ObservationResponse {
  string trial_id = 1;
  int64 frame_id = 2;
  repeated float state = 3;
  repeated ImageFrame images = 4;
  string task = 5;
  bool done = 6;
  reserved 7;
  reserved "success";
  google.protobuf.Struct metadata = 8;
}

message StepRequest {
  string session_id = 1;
  string instruction = 2;
  uint32 max_actions = 3;
  bool reset_session = 4;
}

message StepResponse {
  ObservationResponse observation = 1;
  string status = 2;
  bool done = 3;
  uint32 actions_executed = 4;
  uint32 chunks_executed = 5;
  google.protobuf.Struct progress = 6;
  google.protobuf.Struct diagnostics = 7;
  string error_message = 8;
}

// A single validated RoboCasa action.  This is the environment action channel
// used by analytic harness primitives; model inference remains out of process.
message NativeStepRequest { repeated float action = 1; int64 expected_frame_id = 2; }
message NativeStepResponse { ObservationResponse observation = 1; bool done = 2; google.protobuf.Struct progress = 3; }

// Read-only metric-depth back-projection. This exposes camera geometry at
// caller-selected pixels, never simulator object identities or coordinates.
message ImagePixel { int32 row = 1; int32 col = 2; }
message LocalizePixelsRequest {
  string camera = 1;
  repeated ImagePixel pixels = 2;
  int64 expected_frame_id = 3;
}
message LocalizePixelsResponse {
  int64 frame_id = 1;
  string camera = 2;
  google.protobuf.Struct localization = 3;
}

message TruthResponse {
  bool done = 1;
  bool official_success = 2;
  int64 frame_id = 3;
  google.protobuf.Struct metrics = 4;
}

message EndTrialRequest { string reason = 1; }
message EndTrialResponse { bool ended = 1; }
