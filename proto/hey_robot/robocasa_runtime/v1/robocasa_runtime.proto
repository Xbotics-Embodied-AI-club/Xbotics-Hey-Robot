syntax = "proto3";

package hey_robot.robocasa_runtime.v1;

import "google/protobuf/struct.proto";

// The high-frequency simulator boundary. This is deliberately separate from
// ModelService: a policy rollout owns an episode, while RobotDriver performs
// causal Observe/Step calls against one episode at a time.
service RoboCasaRuntime {
  rpc GetHealth(HealthRequest) returns (HealthResponse);
  rpc CreateEpisode(CreateEpisodeRequest) returns (EpisodeResponse);
  rpc Observe(EpisodeRequest) returns (ObservationResponse);
  rpc Step(StepRequest) returns (StepResponse);
  rpc Reset(EpisodeRequest) returns (ObservationResponse);
  rpc CloseEpisode(EpisodeRequest) returns (CloseEpisodeResponse);
}

message HealthRequest {}

message HealthResponse {
  bool online = 1;
  bool loaded = 2;
  bool busy = 3;
  string error_message = 4;
  google.protobuf.Struct metrics = 5;
}

message CreateEpisodeRequest {
  string task = 1;
  int64 seed = 2;
}

message EpisodeRequest { string episode_id = 1; }

message ImageFrame {
  string camera = 1;
  bytes data = 2;
  string content_type = 3;
  uint32 width = 4;
  uint32 height = 5;
}

message ObservationResponse {
  string episode_id = 1;
  int64 frame_id = 2;
  repeated float state = 3;
  repeated ImageFrame images = 4;
  string task = 5;
  bool done = 6;
  bool success = 7;
  google.protobuf.Struct metadata = 8;
}

message EpisodeResponse { ObservationResponse observation = 1; }

message StepRequest {
  string episode_id = 1;
  repeated float action = 2;
  int64 expected_frame_id = 3;
}

message StepResponse {
  ObservationResponse observation = 1;
  double reward = 2;
  bool done = 3;
  bool success = 4;
  google.protobuf.Struct metrics = 5;
}

message CloseEpisodeResponse { bool closed = 1; }
