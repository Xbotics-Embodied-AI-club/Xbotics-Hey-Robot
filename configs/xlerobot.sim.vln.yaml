deployment:
  id: xlerobot.sim.vln
  bus:
    type: nats
    url: nats://127.0.0.1:4222
    options:
      robot_publish_hz: 2.0
      robot_status_log_every_frames: 30
agent_runtime:
  enabled: true
  robot_id: sim_robot
logging:
  level: DEBUG
  theme: dark
  json_format: false
  file_path: logs/xlerobot.sim.vln/app.log
  json_file_path: logs/xlerobot.sim.vln/app.jsonl
  throttle_sec: 0.0
resources:
  runtime_dir: runtime/xlerobot.sim.vln
  media:
    root: runtime/xlerobot.sim.vln/media
    max_items: 1024
    image_save_every_n: 1
  episodes:
    root: runtime/xlerobot.sim.vln/episodes
  events:
    retain: 2000
skills:
  modules:
  - hey_robot.skills.builtins
  mode: bringup
  tools:
  - inspect_scene
  - navigate_to
  - approach_object
  execution_mode: local
identity:
  enabled: true
  unified_user_episodes: true
  bindings:
    cli:sender:local-user: owner
    web:sender:web-user: owner
    voice:sender:voice-user: owner
    feishu:sender:ou_160f4368eb2ada4edda22bd33ce435af: owner
channels:
  cli:
    type: cli
    enabled: false
    account_id: sim-dev
    prompt: 'sim-dev> '
    sender_id: local-user
    chat_id: sim-dev-local
  web:
    type: web
    enabled: true
    account_id: sim-web
    sender_id: web-user
    host: 0.0.0.0
    port: 8080
    access_log: false
    uvicorn_log_level: warning
  voice:
    type: voice
    enabled: true
    account_id: sim-voice
    sender_id: voice-user
    chat_id: sim-voice
    activation:
      enabled: true
      wake_words:
      - 小白
      - 机器人
      - robot
      strip_wake_word: true
      session_timeout_sec: 60.0
      min_route_chars: 4
    tts_echo_guard_sec: 1.0
    reply_tts: true
    recorder:
      input_device: null
      sample_rate: 16000
      channels: 1
      block_ms: 100
      energy_threshold: 0.02
      silence_sec: 0.5
      pre_roll_sec: 0.4
      min_speech_sec: 0.4
      max_speech_sec: 6.0
    asr:
      provider: doubao
      api_key_env: ARK_API_KEY
      endpoint: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_nostream
      resource_id: volc.seedasr.sauc.duration
      language: zh-CN
      sample_rate: 16000
      bits: 16
      channels: 1
      chunk_ms: 200
    tts:
      provider: doubao
      enabled: true
      api_key_env: ARK_API_KEY
      resource_id: seed-tts-2.0
      voice_type: zh_female_vv_uranus_bigtts
      endpoint: wss://openspeech.bytedance.com/api/v3/tts/bidirection
      encoding: pcm
      sample_rate: 16000
      output_device: null
  feishu:
    type: feishu
    enabled: true
    account_id: sim-feishu
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET
    encrypt_key_env: FEISHU_ENCRYPT_KEY
    verification_token_env: FEISHU_VERIFICATION_TOKEN
    group_policy: mention
    reply_to_message: true
    domain: feishu
    allow_from:
    - '*'
    media_root: runtime/xlerobot.sim.vln/media/feishu
robots:
  sim_robot:
    type: xlerobot_sim
    family: xlerobot
    environment: sim
    driver: mujoco
    embodiment_profile: xlerobot_sim
    enabled: true
    settings:
      mjcf_path: assets/scenes/home_scene.xml
      render_width: 640
      render_height: 480
      control_hz: 2.0
      linear_speed: 0.2
      angular_speed: 0.45
      viewer:
        enabled: false
model_services:
  vln_nav:
    type: vln_planner
    robot_id: sim_robot
    enabled: true
    target: grpc://127.0.0.1:9091
    provides:
    - navigate_to
    - approach_object
    timeout_sec: 60.0
    settings:
      host: 127.0.0.1
      port: 9091
      backend: internvla_n1_dualvln
      control_mode: base_action_chunk
      base_linear_speed: 0.25
      base_angular_speed: 0.30
      max_action_chunk_steps: 4
      system1_replans_per_waypoint: 4
      mock_mode: false
      model_path: models/InternVLA-N1-DualVLN
      # 由 CUDA_VISIBLE_DEVICES / 容器 GPU 映射选择物理设备；容器内不要绑定宿主机编号。
      device: cuda
      dtype: bf16
      attn_implementation: sdpa
      media_root: runtime/xlerobot.sim.vln/media
      internnav_repo: third_party/InternNav
      camera: front
      image_width: 640
      image_height: 480
      resize_w: 384
      resize_h: 384
      discrete_turn_deg: 15
      discrete_forward_cm: 25
      num_history: 8
      max_new_tokens: 128
      hfov: 90
policies:
  embodied_skills:
    enabled: true
    robot_id: sim_robot
    freq_hz: 1.0
agents:
  main:
    enabled: true
    robot_id: sim_robot
    policy_id: embodied_skills
    settings:
      mode: autonomous
      models:
        planner:
          model_env: DEEPSEEK_MODEL
          api_key_env: DEEPSEEK_API_KEY
          base_url_env: DEEPSEEK_BASE_URL
          temperature: 0.0
          max_tokens: 1024
        scene_captioner:
          model_env: DASHSCOPE_MODEL
          api_key_env: DASHSCOPE_API_KEY
          base_url_env: DASHSCOPE_BASE_URL
          temperature: 0.0
          max_tokens: 512
