# XLeRobot dock manipulation MuJoCo simulation.
# Usage: MUJOCO_GL=egl uv run hey-robot run --config configs/so101.dock.sim.yaml

deployment:
  id: so101.dock.sim
  bus:
    type: nats
    url: nats://127.0.0.1:4222
    options:
      robot_publish_hz: 2.0

logging:
  level: INFO
  theme: dark
  json_format: false
  file_path: logs/so101.dock.sim/app.log
  json_file_path: logs/so101.dock.sim/app.jsonl

resources:
  runtime_dir: runtime/so101.dock.sim
  media:
    root: runtime/so101.dock.sim/media
    max_items: 64
    image_save_every_n: 1
  episodes:
    root: runtime/so101.dock.sim/episodes
  events:
    retain: 500

skills:
  modules:
    - hey_robot.skill_os.builtins
  mode: bringup
  enabled:
    - inspect_scene
    - stop_motion
    - reset_posture
    - set_arm_pose
    - move_arm_joints
    - set_gripper
    - pick_wand_from_dock
    - place_wand_to_dock

notifications:
  defaults:
    channels: [cli]
  channels:
    cli: {}
  kinds: {}

identity:
  enabled: true
  unified_user_episodes: true
  bindings:
    "cli:sender:local-user": owner

channels:
  cli:
    type: cli
    enabled: true
    account_id: so101-dock
    prompt: "so101-dock> "
    sender_id: local-user
    chat_id: so101-dock-local

robots:
  dock_arm:
    type: so101_mobile_sim
    family: so101_mobile
    environment: sim
    driver: mujoco
    embodiment_profile: so101_mobile_sim
    enabled: true
    settings:
      mjcf_path: assets/robots/xlerobot/dock_scene.xml
      render_width: 640
      render_height: 480
      viewer:
        enabled: true

model_services: {}

policies:
  embodied_skills:
    enabled: true
    robot_id: dock_arm
    freq_hz: 2.0

agents:
  main:
    enabled: true
    robot_id: dock_arm
    policy_id: embodied_skills
    settings:
      mode: autonomous
      max_iterations: 6
      providers:
        planner:
          type: deepseek
          model_env: DEEPSEEK_MODEL
          api_key_env: DEEPSEEK_API_KEY
          base_url_env: DEEPSEEK_BASE_URL
          temperature: 0.0
          max_tokens: 1024
      execution_feedback:
        backend: status
        media_root: runtime/so101.dock.sim/media
