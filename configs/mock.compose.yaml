deployment:
  id: mock-compose
  bus:
    type: nats
    url: nats://nats:4222
    options:
      robot_publish_hz: 10.0
      robot_status_log_every_frames: 30

agent_runtime:
  enabled: true
  robot_id: mock0

logging:
  level: INFO
  theme: dark
  json_format: false
  file_path: runtime/mock.compose/app.log
  json_file_path: runtime/mock.compose/app.jsonl

resources:
  runtime_dir: runtime/mock.compose
  media:
    root: runtime/mock.compose/media
    max_items: 128
    image_save_every_n: 1
  episodes:
    root: runtime/mock.compose/episodes
  events:
    retain: 2000

skills:
  modules:
  - hey_robot.skills.builtins
  mode: bringup
  tools:
  - inspect_scene
  execution_mode: local

identity:
  enabled: true
  unified_user_episodes: true
  bindings:
    web:sender:compose-user: owner

channels:
  web:
    type: web
    enabled: true
    account_id: mock-compose-web
    host: 0.0.0.0
    port: 8080
    sender_id: compose-user
    chat_id: mock-compose
    serve_frontend: false
    access_log: false
    uvicorn_log_level: warning

robots:
  mock0:
    type: mock
    family: xlerobot
    environment: mock
    driver: mock
    embodiment_profile: xlerobot_mock
    enabled: true
    body: xlerobot
    control_hz: 10.0
    world:
      locations:
        front_workspace: {}
        table: {}
      objects:
        marker:
          visible: true
          location: table
          graspable: true

model_services: {}

policies:
  embodied_skills:
    enabled: true
    robot_id: mock0
    freq_hz: 10.0

agents:
  main:
    enabled: true
    robot_id: mock0
    policy_id: embodied_skills
    settings:
      mode: autonomous
      models:
        planner:
          model_env: DEEPSEEK_MODEL
          api_key_env: DEEPSEEK_API_KEY
          base_url_env: DEEPSEEK_BASE_URL
          temperature: 0.0
          max_tokens: 1024
        media_root: runtime/mock.compose/media
