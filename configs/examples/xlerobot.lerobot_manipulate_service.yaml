# Settings for the generic gRPC RobotPolicyService.
#
# Copy these settings into model_services.manipulate.settings, then start it with:
#   hey-robot model-service --config <deployment.yaml> --service-id manipulate

runtime: lerobot

active_arm: right
state_schema: so101_single_arm_rad_gripper01
action_schema: so101_single_arm_rad_gripper01
camera_names:
  - front
  - right_wrist

policy_path: models/xlerobot-home-so101-smolvla/checkpoints/last/pretrained_model
policy_device: cuda
embodiment: xlerobot
robot_type: so101
action_space: xlerobot_single_arm_joint
action_dimensions: 6
state_dimensions: 6
