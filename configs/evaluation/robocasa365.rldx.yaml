deployment:
  id: robocasa365.rldx
  bus:
    type: in_memory
    url: memory://robocasa365.rldx
resources:
  runtime_dir: runtime/robocasa365.rldx
  media:
    root: runtime/robocasa365.rldx/media
    max_items: 10000
    image_save_every_n: 1
  episodes:
    root: runtime/robocasa365.rldx/episodes
  events:
    retain: 10000
identity:
  enabled: true
  unified_user_episodes: false
  bindings:
    web:sender:robocasa365-benchmark: owner
agent_runtime:
  enabled: true
  robot_id: robocasa365
  hard_max_wall_time_sec: 7200
  hard_max_skills: 220
  completion_authority: environment
channels:
  web:
    type: web
    enabled: true
    account_id: robocasa365-web
    host: 127.0.0.1
    port: 18080
    sender_id: robocasa365-benchmark
    chat_id: robocasa365-benchmark
    access_log: false
    uvicorn_log_level: warning
skills:
  modules:
  - hey_robot.skills.builtins
  tools:
  - inspect_scene
  - read_execution_memory
  - manipulate
  - localize
  - read_progress
  - move_to
  - move_delta
  - grip
  - release
  - scripted_grasp
  - drive_to
  - drive_base
  execution_mode: local
robots:
  robocasa365:
    type: robocasa
    family: robocasa
    environment: remote
    driver: grpc
    embodiment_profile: robocasa_remote
    settings:
      target: grpc://127.0.0.1:9092
      managed_backend: true
      backend_python: .venv-robocasa365/bin/python
      backend_startup_timeout_sec: 1800
      # One RLDX option can execute 560 simulator actions; its data-plane RPC
      # must outlive the policy request rather than applying the old action-step
      # deadline.
      timeout_sec: 660
      control_hz: 20
      supported_driver_primitives:
      - inspect_scene
      - embodiment_native_action
      default_task: CloseFridge
      default_seed: 1000
      task_split: target
      object_registries:
      - objaverse
      - lightwheel
      mujoco_gl: egl
      mujoco_device: "0"
model_services:
  robocasa365:
    type: robot_policy
    robot_id: robocasa365
    enabled: true
    target: grpc://127.0.0.1:9091
    provides:
    - manipulate
    timeout_sec: 1800
    settings:
      runtime: rldx
      service_python: .venv/bin/python
      health_timeout_sec: 10
      auth_token_env: ROBOCASA_DATA_TOKEN
      policy_path: /home/liberow/models/robocasa365/rldx-1-ft-rc365
      policy_device: cuda:1
      embodiment: robocasa
      action_space: robocasa_12d
      action_dimensions: 12
      action_low: -1.0
      action_high: 1.0
      state_dimensions: 16
      camera_names:
      - camera1
      - camera2
      - camera3
      media_root: runtime/robocasa365.rldx/media
      # The adaptive policy interface invokes RLDX for one contact-rich state transition at a
      # time.  The executor must therefore consume the agent's concise,
      # official-language subgoal; using environment_root here silently turns
      # every retry back into a full-task VLA rollout.
      prompt_mode: agent_subgoal
      execution_horizon: 8
      base_clip: 0.1
      video_delta_indices: [-6, -4, -2, 0]
      control_hz: 20
      request_timeout_sec: 600
      server_startup_timeout_sec: 1500
      server_port: 15555
      rldx_repo: .deps/RLDX-1
      rldx_python: .venv-rldx/bin/python
      attention_impl: sdpa
      hf_home: /home/liberow/.cache/huggingface
      hf_xet_high_performance: true
policies:
  embodied_skills:
    enabled: true
    robot_id: robocasa365
    freq_hz: 1.0
agents:
  main:
    enabled: true
    robot_id: robocasa365
    policy_id: embodied_skills
    settings:
      mode: autonomous
      models:
        planner:
          # gpt-5.5: fast enough for repeated tool-loop decisions. gpt-5.6-terra
          # stalls 5-10 min per decision once the transcript grows.
          model: gpt-5.5
          api_key_env: OPENAI_API_KEY
          base_url_env: OPENAI_BASE_URL
          temperature: 0.0
          max_tokens: 2048
          timeout_sec: 30
          max_retries: 0
        scene_captioner:
          # gpt-5.5: faster and more reliable than gpt-5.6-terra for the
          # structured scene-caption JSON; gpt-5.6-terra stalls under repeated
          # calls and returns unparseable output (confidence=0 discard).
          enabled: true
          model_env: OPENAI_MODEL
          api_key_env: OPENAI_API_KEY
          base_url_env: OPENAI_BASE_URL
          temperature: 0.0
          max_tokens: 1024
          timeout_sec: 30
          max_retries: 0
